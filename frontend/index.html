<!doctype html>
<html lang="fr">
  <head>
    <!-- Character Encoding -->
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sourx HR | Gérez Votre Équipe Efficacement</title>
    <meta
      name="description"
      content="Sourx HR est une plateforme moderne conçue pour rationaliser la gestion des ressources humaines, permettant aux équipes de collaborer et de réaliser davantage."
    />

    <meta

      content="gestion des RH, collaboration en équipe, gestion des employés, Sourx HR"
    />
    <!-- Author -->
    <meta name="author" content="Sourx HR Team" />
    <!-- Open Graph for Social Media -->
    <meta
      property="og:title"
      content="Sourx HR | Gérez Votre Équipe Efficacement"
    />
    <meta
      property="og:description"
      content="Rationalisez vos processus RH avec Sourx HR, la plateforme ultime pour la gestion d'équipe et la collaboration."
    />

    <meta property="og:url" content="https://hr.sourx.com" />
    <meta property="og:type" content="website" />
    <!-- Twitter Card for Social Sharing -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Sourx HR | Gérez Votre Équipe Efficacement"
    />
    <meta
      name="twitter:description"
      content="Sourx HR est une plateforme moderne conçue pour rationaliser la gestion des ressources humaines."
    />
    <meta
      name="twitter:image"
      content="https://hr.sourx.com/twitter-image.png"
    />
    <!-- Favicons -->
    <link rel="icon" href="./src/assets/logo.svg" type="image/png" />
    <link rel="apple-touch-icon" href="@/assets/logo.png" />
    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@600&family=Raleway:wght@382&display=swap"

    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Sourx HR",
        "url": "https://hr.sourx.com",
        "logo": "https://hr.sourx.com/logo.png",
        "description": "Rationalisez vos processus RH avec Sourx HR."
      }

  </head>
  <body>
